[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "1.0.0"
description = "Hands-free voice assistant for Windows: wake word, local speech recognition, Claude with tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.14.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "pydantic>=2.6",
    "psutil>=5.9",
    "ddgs>=9.0",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "faster-whisper>=1.1.0",
    "edge-tts>=7.0.0",
    "keyboard>=0.13.5; sys_platform == 'win32'",
    "pynput>=1.7.7",
    "openwakeword>=0.6.0",
    "onnxruntime>=1.16",
    "requests>=2.31",
    "feedparser>=6.0",
    "send2trash>=1.8.2",
    "pyperclip>=1.8.2",
    "pyautogui>=0.9.54",
    "Pillow>=10.0",
    "screen-brightness-control>=0.20",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.2; sys_platform == 'win32'",
    "winotify>=1.1.0; sys_platform == 'win32'",
    "pystray>=0.19.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.0", "pyinstaller>=6.0"]

[project.scripts]
jarvis = "main:main"

[project.gui-scripts]
jarvisw = "main:main"   # no console window (like pythonw)

[tool.setuptools]
# The app keeps its flat layout (main.py + core/ tools/ ui/) and reads config.yaml
# next to main.py, so install it editable: pip install -e .
py-modules = ["main"]
packages = ["core", "tools", "ui"]

[tool.setuptools.package-data]
ui = ["hud/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
