# Jarvis configuration. Secrets (ANTHROPIC_API_KEY) live in .env, not here.
# Paths may use ~ and %ENV_VARS% / $ENV_VARS. Relative paths are resolved
# against this file's folder.

assistant:
  name: Jarvis
  user_name: ""            # how Jarvis addresses you, e.g. "Aditya" (empty = "sir")

llm:
  provider: anthropic       # anthropic (Claude, paid) | gemini (Google, free tier; key in GEMINI_API_KEY)
  model: claude-sonnet-5-5
  gemini_model: gemini-flash-latest   # used when provider is gemini, e.g. gemini-2.5-flash
  max_tokens: 16000         # cap on thinking + reply per request
  effort: low               # low | medium | high - low keeps voice replies snappy
  max_history_turns: 10     # user/assistant exchanges kept as context
  max_tool_rounds: 8        # tool-call round trips allowed per request
  max_tool_calls: 6         # total tool calls allowed per request (stops loops)
  request_timeout_s: 60
  max_retries: 2
  refusal_fallback: true    # let the API retry a declined request on a fallback model

tools:
  timeout_s: 30             # per tool call
  disabled: []              # tool names to hide from the model, e.g. [web_search]
  disabled_modules: []      # whole modules, e.g. [media_tools]

  # Spoken folder names for file tools ("desktop", "downloads", ...). File tools
  # only work inside safe_roots below, so a name pointing elsewhere is refused.
  folders:
    home: "~"
    desktop: "~/Desktop"
    documents: "~/Documents"
    downloads: "~/Downloads"
    pictures: "~/Pictures"
    music: "~/Music"
    videos: "~/Videos"

# --- Voice (Phase 2) -------------------------------------------------------

audio:
  input_device: null        # null = Windows default mic; or an index / part of the
  output_device: null       # name from `python main.py --list-devices`
  sample_rate: 16000        # what speech recognition expects; don't change
  min_press_s: 0.3          # shorter hotkey taps are ignored
  beeps: true               # beep when recording starts/stops
  headphones: false         # true = voice barge-in while Jarvis talks (see README)
  echo_tail: 0.3            # speakers: seconds of audio ignored after Jarvis stops talking

hotkey: "f9"                # push-to-talk key: "f9", "right ctrl", "caps lock", ...
hotkey_backend: auto        # auto | keyboard | pynput (auto = keyboard on Windows)

# --- Wake word, voice detection, conversation (Phase 3) --------------------

wake:
  model: hey_jarvis         # built-in, or a path to a custom .onnx model
  threshold: 0.5            # 0-1; raise if it fires by itself, lower if it misses you
  cooldown: 1.5             # seconds before it can fire again
  listen_timeout: 5         # seconds to start talking after the wake word

vad:
  engine: silero            # silero (accurate) | energy (fallback, loudness-based)
  threshold: 0.5            # speech probability needed per 32 ms window
  silence_timeout: 1.0      # pause that ends your request; raise if you get cut off
  max_utterance: 15         # longest request, seconds
  min_speech: 0.3           # shorter sounds (coughs, clicks) are ignored
  preroll: 0.5              # audio kept from just before you start talking

follow_up:
  enabled: true             # keep listening after a reply, no wake word needed
  window: 6                 # seconds to start a follow-up

barge_in:
  min_speech: 0.4           # headphones mode: talk this long over Jarvis to interrupt

stt:
  model: small.en           # tiny.en / base.en are faster, medium.en more accurate
  device: auto              # auto (GPU if CUDA works, else CPU) | cuda | cpu
  compute_type: auto        # auto = float16 on GPU, int8 on CPU
  beam_size: 1              # 1 = fastest; 5 = slightly more accurate
  download_root: null       # model cache folder (null = Hugging Face default)
  min_rms: 0.004            # audio quieter than this is treated as silence

tts:
  engine: edge              # edge | piper (coming later) | elevenlabs (coming later)
  voice: en-GB-RyanNeural   # list voices: edge-tts --list-voices
  rate: "+0%"               # speaking speed, e.g. "+15%"
  volume: "+0%"
  filler: true              # say "One moment." while a slow tool runs
  filler_delay: 2.5         # seconds of silence before the filler
  fillers: ["One moment.", "On it.", "Just a second."]

# --- Tools, memory and safety (Phase 4) -------------------------------------

# Friendly names -> command/executable for open_app. Anything not listed is
# matched against your Start Menu shortcuts ("excel" -> Excel), then PATH.
apps:
  chrome: chrome.exe
  vscode: code
  vs code: code
  spotify: spotify.exe
  notepad: notepad.exe
  calculator: calc.exe
  explorer: explorer.exe
  file explorer: explorer.exe
  task manager: taskmgr.exe
  paint: mspaint.exe
  edge: msedge
  firefox: firefox
  terminal: wt

# File tools (search, open, read, notes, delete) only work inside these folders.
safe_roots: ["~/Documents", "~/Downloads", "~/Desktop"]
notes_dir: "~/Documents/Jarvis Notes"          # must be inside safe_roots
screenshots_dir: "~/Pictures/Jarvis Screenshots"

# Your coding projects: "open cs-events", "git status for cs-events",
# "start the cs-events dev server". Set path to the project folder.
projects:
  cs-events:
    path: ""                # e.g. "~/code/cs-events" or "D:/projects/cs-events"
    dev_command: "npm run dev"

weather:
  city: "Chhatrapati Sambhajinagar"
  lat: 19.8762
  lon: 75.3433
  units: celsius            # celsius | fahrenheit

news_feeds:
  - "https://feeds.bbci.co.uk/news/world/rss.xml"

briefing:
  include: [weather, news, todos, reminders]

safety:
  confirm_dangerous: true   # ask yes/no before tools marked dangerous=True
  confirm_timeout: 8        # seconds; silence (or anything but a clear yes) = no
  # Programs run_command_in_project may start. Everything else is blocked.
  shell_allowlist: [git, npm, npx, python, pip, node, ls, dir]
  auto_approve_allowlist: false   # true = allowlisted commands run without asking

# --- Desktop integration (Phase 5) ------------------------------------------

ui:
  window: true              # the desktop window (closing it hides Jarvis to the tray)
  tray: false               # always show the tray icon (it's on anyway under pythonw / --tray)
  overlay: false            # small on-screen box showing what Jarvis heard and says
  overlay_position: bottom-right   # top-left | top-right | bottom-left | bottom-right
  overlay_fade_s: 4         # seconds after going idle before it fades

startup:
  chime: true               # chime when Jarvis is ready
  greeting: "Jarvis online."   # spoken at launch ("" = silent)
  time_greeting: true       # prefix with "Good morning, <user_name>."
  auto_briefing: false      # daily briefing on the first launch of each day

paths:
  logs_dir: logs
  data_dir: data

logging:
  level: INFO               # DEBUG for troubleshooting
